[project]
name = "labqueue"
version = "0.1.0"
description = "Graduate student GPU queue: coursework environment and planning scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12,<14"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labqueue"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["_bmad", ".agents", ".tools", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
